<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Statements - Solve-A-Thon 1.0</title>
    <meta name="description" content="View problem statements for Solve-A-Thon 1.0.">
    <!-- Font and Style Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="elements/favicon.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GSAP Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* Specific Styles for Problem Page */
        body {
            background-color: #050510;
        }

        #track-selection {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 100px;
            /* Space for navbar */
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            margin-top: 3rem;
        }

        .track-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .track-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .track-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .track-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            text-transform: uppercase;
            color: #fff;
        }

        .track-desc {
            color: #ccc;
            font-size: 0.9rem;
        }

        .active-track {
            border-color: var(--primary-color);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        /* Problem List Styles (Hidden Initially) */
        .problem-list {
            display: none;
            margin-top: 3rem;
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>

<body>

    <!-- Simple Loader -->
    <div id="loader" class="page-loader">
        <div class="jet-container">
            <img src="elements/loading_jet.png" alt="Loading" class="loading-jet-img-sm">
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-text">
                SOLVEATHON 1.0 <i class="fa-solid fa-jet-fighter-up"></i>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <!-- New Problems Link -->
            <li><a href="problems.html" class="active-page" style="color: var(--primary-color);">Problem Statements</a>
            </li>
            <li><a href="index.html#events">Events</a></li>
            <li><a href="user_login.html">Login</a></li>
            <li><a href="user_register.html" class="nav-btn">Join Mission</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <!-- Main Section -->
    <section id="track-selection">
        <div class="container">
            <h2 class="section-title">Mission Objectives</h2>
            <p class="subtitle" style="font-size: 1.2rem; letter-spacing: 3px; color: var(--secondary-color);">Select
                Your Track</p>

            <!-- Navbar-style Track Selection -->
            <!-- Dropdown-style Track Selection -->
            <div style="position: relative; width: 100%; max-width: 400px; margin: 0 auto;">
                <select id="track-select" onchange="selectTrack(this.value)" style="
                    width: 100%;
                    padding: 15px 20px;
                    background: rgba(0, 0, 0, 0.6);
                    backdrop-filter: blur(10px);
                    color: #fff;
                    border: 1px solid var(--primary-color);
                    border-radius: 50px;
                    font-family: var(--font-heading);
                    font-size: 1.1rem;
                    cursor: pointer;
                    appearance: none;
                    -webkit-appearance: none;
                    outline: none;
                    box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
                    transition: 0.3s;
                ">
                    <option value="" disabled selected>Select Your Track</option>
                    <option value="UG" style="background: #000;">Cadet League (BCA/BSc)</option>
                    <option value="PG" style="background: #000;">Commander League (MCA/Msc/BE)</option>
                </select>
                <i class="fa-solid fa-chevron-down" style="
                    position: absolute;
                    right: 20px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--primary-color);
                    pointer-events: none;
                "></i>
            </div>

            <!-- Placeholder for Problem Statements Content -->
            <div id="problems-container" class="problem-list glass-panel">
                <h3 id="selected-track-title"
                    style="color: var(--primary-color); font-family: var(--font-heading); margin-bottom: 2rem;"></h3>
                <div style="padding: 2rem; border: 1px dashed rgba(255,255,255,0.2); border-radius: 10px;">
                    <p style="color: #ccc; font-size: 1.2rem;">Decrypting Mission Files... Problem Statements will be
                        revealed here.</p>
                </div>
            </div>

        </div>

        <!-- Background Elements -->
        <div class="hero-background">
            <div class="stars"></div>
            <div class="twinkling"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2026 Solve-A-Thon 1.0 | Department of MCA, SIT</p>
            </div>
        </div>
    </footer>

    <script src="config.js"></script>
    <script>
        // Loader
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            if (loader) {
                gsap.to(loader, { opacity: 0, duration: 0.5, onComplete: () => loader.style.display = 'none' });
            }

            // Animation for new buttons
            gsap.from(".glass-panel button", {
                y: 30,
                opacity: 0,
                duration: 0.6,
                stagger: 0.1,
                ease: "power2.out",
                delay: 0.2
            });
        });

        // Hamburger
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        if (hamburger) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('active');
            });
        }

        const problemStatements = {
            UG: `
                <div class="problem-content" style="text-align: left;">
                    <h2 style="color: var(--primary-color); margin-bottom: 1rem; font-family: var(--font-heading); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);">Departmental Digital Resource & Knowledge Hub</h2>
                    <p style="margin-bottom: 1.5rem; color: #ddd; font-size: 1.1rem;">Currently, academic resources (notes, question banks, textbooks) are scattered across WhatsApp and emails, leading to fragmentation and misinformation. The objective is to build a centralized Web Portal—similar to the DHI or College ERP interface—that serves as a digital library and notice board for the department.</p>
                    
                    <h3 style="color: var(--secondary-color); margin-top: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">User Roles (The Actors)</h3>
                    <ul style="list-style: none; padding-left: 0; color: #ccc; margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                        <li style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;"><i class="fa-solid fa-user-shield" style="color: var(--primary-color); margin-right: 10px;"></i> <strong>The Admin (HOD):</strong> Super User who oversees the entire system.</li>
                        <li style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;"><i class="fa-solid fa-chalkboard-user" style="color: var(--primary-color); margin-right: 10px;"></i> <strong>Faculty:</strong> Content Creators and Approvers.</li>
                        <li style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;"><i class="fa-solid fa-user-graduate" style="color: var(--primary-color); margin-right: 10px;"></i> <strong>Students:</strong> Consumers and Contributors.</li>
                    </ul>

                    <h3 style="color: var(--secondary-color); margin-top: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Module Breakdown</h3>
                    <div style="display: grid; gap: 1.5rem; margin-top: 1.5rem;">
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">1. Authentication & Security Module</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">Student Registration with USN, Name, Semester. Secure login for all three roles. Validation to prevent duplicate accounts.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">2. The "Smart Repository" (Upload & Download)</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">Supported Formats: PDF, PPT/PPTX, DOC/DOCX, JPG/PNG. Faculty uploads bypass approval. Student uploads enter "Pending Approval" state.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">3. The "Gatekeeper" System (Admin Approval)</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">HOD/Faculty review student uploads. Approve (Publish) or Reject (Delete). Only approved files appear in search.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">4. Advanced Search & Filtering Engine</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">Filter by Subject Code, Semester, and Professor. Outcome: A clean grid view of files matching criteria.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">5. Digital Notice Board</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">Dedicated section for "Department Circulars". Urgent notices highlighted in different colors/tags for 24 hours.</p>
                        </div>
                    </div>
                     <div style="margin-top: 2rem; padding: 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 8px; border: 1px solid var(--primary-color);">
                        <p style="color: #fff; font-style: italic;"><i class="fa-solid fa-star" style="color: var(--primary-color); margin-right: 5px;"></i> <strong>Bonus Features:</strong> Students are encouraged to implement advanced features to distinguish their project and gain bonus points.</p>
                    </div>
                </div>
            `,
            PG: `
                <div class="problem-content" style="text-align: left;">
                    <h2 style="color: var(--primary-color); margin-bottom: 1rem; font-family: var(--font-heading); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);">"PlacementPro" – The Integrated Campus Career Suite</h2>
                    <p style="margin-bottom: 1.5rem; color: #ddd; font-size: 1.1rem;">A Role-Based Web Application that acts as the central brain for the college's placement activities. Replaces Excel sheets with a dynamic database and notice boards with real-time dashboards.<br><strong>Target Platform:</strong> Web Application (Priority) + Mobile App (Optional Bonus).</p>
                    
                    <h3 style="color: var(--secondary-color); margin-top: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Application Architecture</h3>
                    
                    <div style="display: grid; gap: 1.5rem; margin-top: 1.5rem;">
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">1. The Placement Officer (TPO) Admin Dashboard</h4>
                            <ul style="list-style: none; padding: 0; color: #aaa; font-size: 0.95rem;">
                                <li style="margin-bottom: 0.5rem;"><strong>The Criteria Engine:</strong> Enter constraints (CGPA, Backlogs, Branch). Query student database instantly. One-click "Notify All Eligible".</li>
                                <li><strong>Interview Scheduler:</strong> Drag-and-drop calendar to assign interview slots.</li>
                            </ul>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">2. The Student Application</h4>
                            <ul style="list-style: none; padding: 0; color: #aaa; font-size: 0.95rem;">
                                <li style="margin-bottom: 0.5rem;"><strong>Resume Wizard:</strong> Generate standardized, college-branded PDF resumes from profile data.</li>
                                <li style="margin-bottom: 0.5rem;"><strong>Live Feed:</strong> Personalized feed showing only eligible companies.</li>
                                <li><strong>Application Tracker:</strong> Status indicators (Applied, Aptitude, Interview, Selected).</li>
                            </ul>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">3. The Alumni "Connect" Portal</h4>
                            <p style="font-size: 0.95rem; color: #aaa;"><strong>Job Referral Board:</strong> Alumni post job openings. <strong>Mentorship Slots:</strong> Alumni set available hours for guidance.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">4. "Market Intelligence" & Analytics Dashboard</h4>
                            <p style="font-size: 0.95rem; color: #aaa;"><strong>Skill Gap Analysis:</strong> Compares student profile against real market data to recommend learning paths.</p>
                        </div>
                        <div class="glass-panel" style="padding: 1.5rem; border-left: 3px solid var(--primary-color);">
                            <h4 style="color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem;">5. "PlacementBot" (Virtual Career Assistant)</h4>
                            <p style="font-size: 0.95rem; color: #aaa;">Automates replies for common queries like cutoffs, interview dates, venues, etc.</p>
                        </div>
                    </div>
                    
                    <div style="margin-top: 2rem; padding: 1rem; background: rgba(0, 243, 255, 0.1); border-radius: 8px; border: 1px solid var(--primary-color);">
                        <p style="color: #fff; font-style: italic;"><i class="fa-solid fa-star" style="color: var(--primary-color); margin-right: 5px;"></i> <strong>Bonus Features:</strong> Implement advanced features like Mobile App integration to distinguish your project.</p>
                    </div>
                </div>
            `
        };

        function selectTrack(track) {
            const container = document.getElementById('problems-container');
            const title = document.getElementById('selected-track-title');

            if (!track) return;

            container.style.display = 'block';
            title.innerText = track === 'UG' ? "Cadet League Problem Statements (BCA/BSc)" : "Commander League Problem Statements (MCA/Msc/BE)";

            // Look for existing content area or create it
            let contentArea = document.getElementById('generated-problem-content');

            // Clear previous placeholder or content
            // We want to keep the title, so we append the content after the title
            // Check if we already have the content div
            if (!contentArea) {
                contentArea = document.createElement('div');
                contentArea.id = 'generated-problem-content';
                container.appendChild(contentArea);

                // Hide the default placeholder if it exists
                const placeholder = container.querySelector('div[style*="dashed"]');
                if (placeholder) {
                    placeholder.style.display = 'none';
                }
            }

            contentArea.innerHTML = problemStatements[track];

            // Animate it in
            gsap.from(contentArea, {
                y: 20,
                opacity: 0,
                duration: 0.5,
                ease: "power2.out"
            });

        }


    </script>
</body>

</html>
